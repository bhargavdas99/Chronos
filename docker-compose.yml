version: "3.8"

services:
  # Primary Database
  postgres:
    image: postgres:15-alpine
    container_name: chronos-postgres
    environment:
      POSTGRES_USER: chronos_user
      POSTGRES_PASSWORD: chronos_password
      POSTGRES_DB: chronos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos_user -d chronos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Connection Pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: chronos-pgbouncer
    environment:
      DB_USER: chronos_user
      DB_PASSWORD: chronos_password
      DB_HOST: postgres
      DB_NAME: chronos_db
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy

  # API Gateway / Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: chronos-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
      - app-3

  # Task Queue Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chronos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: chronos
      RABBITMQ_DEFAULT_PASS: chronos123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Event Streaming (Kafka + Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: chronos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: chronos-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # FastAPI Worker Container 1
  app-1:
    build: .
    container_name: chronos-app-1
    environment:
      DATABASE_URL: postgresql://chronos_user:chronos_password@pgbouncer:5432/chronos_db
    depends_on:
      - pgbouncer

  # FastAPI Worker Container 2
  app-2:
    build: .
    container_name: chronos-app-2
    environment:
      DATABASE_URL: postgresql://chronos_user:chronos_password@pgbouncer:5432/chronos_db
    depends_on:
      - pgbouncer

  # FastAPI Worker Container 3
  app-3:
    build: .
    container_name: chronos-app-3
    environment:
      DATABASE_URL: postgresql://chronos_user:chronos_password@pgbouncer:5432/chronos_db
    depends_on:
      - pgbouncer
      
volumes:
  postgres_data:
  rabbitmq_data:
