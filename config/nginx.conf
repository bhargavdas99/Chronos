events {
    # Defines the maximum number of simultaneous connections that each worker process can handle
    worker_connections 1024;
}

http {
    # 1. Define the upstream cluster of FastAPI worker containers
    upstream chronos_app {
        # Round-Robin Load Balancing across internal Docker container service aliases
        server chronos-app-1:8000 max_fails=3 fail_timeout=10s;
        server chronos-app-2:8000 max_fails=3 fail_timeout=10s;
        server chronos-app-3:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        # Intercept incoming traffic on host port 80
        listen 80;
        server_name localhost;

        # Disable verbose server version exposure for security hardening
        server_tokens off;

        location / {
            # Proxy incoming requests to the upstream application pool
            proxy_pass http://chronos_app;

            # HTTP/1.1 for persistent Keep-Alive connections
            proxy_http_version 1.1;

            # Forward real client connection headers to FastAPI
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts to drop stale/unresponsive application connections
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}